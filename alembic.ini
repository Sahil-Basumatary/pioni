[alembic]
script_location = alembic
# URL is overridden in env.py from ALEMBIC_DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname
file_template = %%(rev)s_%%(slug)s
timezone = UTC
# truncate long names from autogenerate
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
