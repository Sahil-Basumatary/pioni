apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: pioniprom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          url: '${JAEGER_BROWSE_URL}/trace/$${__value.raw}'
          urlDisplayLabel: "View trace"

  - name: Jaeger
    type: jaeger
    uid: pionijaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
