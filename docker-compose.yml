services:
  postgres:
    image: postgres:16-alpine
    container_name: pioni-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pioni}
      POSTGRES_USER: ${POSTGRES_USER:-pioni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pioni_dev_pass}
    volumes:
      - pioni-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pioni} -d ${POSTGRES_DB:-pioni}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pioni-net

  redis:
    image: redis:7-alpine
    container_name: pioni-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - pioni-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - pioni-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pioni-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pioni}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pioni_dev_pass}
    volumes:
      - pioni-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - pioni-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pioni-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pioni-prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pioni-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pioni-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      JAEGER_BROWSE_URL: ${JAEGER_BROWSE_URL:-http://localhost:16686}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pioni-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pioni-net

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: pioni-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - pioni-net

volumes:
  pioni-pgdata:
  pioni-redis:
  pioni-rabbitmq:
  pioni-prometheus:
  pioni-grafana:

networks:
  pioni-net:
    driver: bridge
